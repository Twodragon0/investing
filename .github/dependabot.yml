version: 2

# Enable security updates for all ecosystems
registries: {}

updates:
  # pip — 저장소의 두 매니페스트를 **이 항목 하나가** 커버한다:
  #   scripts/requirements.txt  (런타임)
  #   requirements-dev.txt      (ruff, pytest, playwright, basedpyright)
  #
  # 이전에는 `/scripts` 와 `/` 두 항목이었다. 그 분리는 "Dependabot 의 pip
  # 디렉토리는 정확히 그 경로의 매니페스트만 읽는다" 는 전제 위에 있었는데,
  # **그 전제가 틀렸다**. `/` 는 하위 `requirements*.txt` 를 재귀 탐색한다 —
  # 2026-08-24 실측으로 `/` 항목이 `scripts/requirements.txt` 를 바꾼 PR 이
  # 7건이었다: #1097 #1098 #1100 #1106 #1143 #1144 #1189.
  #
  # 결과는 체계적 중복이었다. 같은 bump 가 두 브랜치(`dependabot/pip/<pkg>` 와
  # `dependabot/pip/scripts/<pkg>`)로 두 번 열렸고, 둘 다 락 게이트에 걸려
  # 정체 PR 을 두 배로 만들었다. #1184 와 #1189 가 그 쌍이다 — 동일한 boto3
  # bump, 동일한 파일.
  #
  # 통합의 대가: prefix 로 런타임/개발을 구분하던 신호가 사라진다. 중립적인
  # `chore(deps):` 로 통일했다 — 어차피 `/` 항목의 `chore(deps-dev):` 는 런타임
  # 의존성 bump 에도 붙어서(#1189) 이미 신뢰할 수 없는 신호였다.
  #
  # limit 은 두 항목분(5+5)을 합쳐 8 로 둔다. 중복이 사라지므로 10 은 불필요하다.
  #
  # **핀 표기가 auto-merge 대상 여부를 가른다** (2026-09-15 실측).
  # `dependabot/fetch-metadata` 의 `update-type` 은 매니페스트의 표기 방식에 따라
  # 다르게 나온다. `dependabot-auto-merge.yml` 은 `version-update:semver-patch`
  # 에만 걸리므로, 같은 크기의 bump 라도 표기에 따라 자동 머지 여부가 갈린다:
  #
  #   ruff==0.16.6    → 0.16.7   ⇒ semver-patch   (#1319, 스텝 실행됨)
  #   numpy~=2.4.4    → ~=2.4.6  ⇒ semver-patch   (#1320, 스텝 실행됨)
  #   boto3>=1.43.88  → >=1.43.92 ⇒ semver-**major** (#1321)
  #
  # 마지막 줄이 요점이다. 범위 제약(`>=X,<Y`)의 하한을 올리는 bump 는 패치 크기여도
  # major 로 분류돼 자동 머지 경로를 **아예 타지 않는다**. #1321 이 그래서 사람 손으로
  # 락까지 재생성해야 했다. 표기를 바꿀 계획은 없다 — boto3 는 graceful degradation
  # 대상이라 상한만 막아두면 충분하고, 자동 머지는 부수적이다. 다만 "왜 저 PR 만
  # 자동으로 안 닫히지" 를 다시 조사하지 않도록 여기 남긴다.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps):"
    groups:
      security-patches:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ruby"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps):"
