name: Supply-chain Lock Verify

# 추가형(additive) 공급망 방어: scripts/requirements.lock 은 pip-compile
# --generate-hashes 로 생성한 해시 핀 락(직접+전이 의존성 전체, 전 플랫폼 휠
# 해시 포함)이다. 이 워크플로우는 락 무결성만 검증하며, 기존 12개 워크플로우의
# `pip install -r scripts/requirements.txt` 흐름은 건드리지 않는다(breakage 0).
#
# 단계적 롤아웃 완료: 무결성 스텝은 안정화 기간 동안 non-blocking(경고)로 운영했고,
# 2026-08-26 에 `|| echo ...` fallback 을 제거해 **차단 게이트로 승격**했다.
#
# 차단 승격 이력:
#   - 도입 2026-06-22 (non-blocking). 승격 예정일 2026-07-06.
#   - 실제 승격 2026-08-26 (이슈 #1039). 승격 시점 게이트 실측:
#     (a) 예정일 경과, (b) 최근 15런 전부 success,
#     (c) 최근 8런에서 `::warning title=lock integrity::` 실제 발생 0건.
#   - 이제 무결성 검증이 비-0 로 끝나면 `verify` 잡이 실패하고, `gate` 가 그 실패를
#     fail-closed 로 전파한다(tests/test_supply_chain_lock_gate_guard.py).
#   - staleness/hashless 회귀는 이미 매 PR pytest 잡의
#     tests/test_requirements_lock_coverage.py 가 차단한다(이 워크플로우 트리거 무관).
#
# 락 갱신 방법(의존성 변경 시) — 원클릭 헬퍼:
#   bash scripts/refresh_requirements_lock.sh
# (격리 venv + python3.11 + pip-compile --generate-hashes, 재생성 후 가드/무결성 검증)
#
# 수동(헬퍼 미사용 시):
#   python3.11 -m venv /tmp/lockgen && /tmp/lockgen/bin/pip install pip-tools==7.5.3
#   /tmp/lockgen/bin/pip-compile --generate-hashes --no-strip-extras \
#     --output-file scripts/requirements.lock scripts/requirements.txt
# (--no-strip-extras: pip-tools 8.0.0 부터 strip 이 기본 — 현 락의 extras 핀
#  lxml[html-clean] 분해를 막기 위해 명시. pip-tools 도 7.5.3 핀 권장.)

on:
  push:
    paths:
      - 'scripts/requirements.txt'
      - 'scripts/requirements.lock'
      - '.github/workflows/supply-chain-lock.yml'
  # paths 필터 없음 — 의도적이다. required status check 로 걸려면 이 워크플로우가
  # **모든 PR 에서 리포트**해야 한다. paths 로 걸러진 워크플로우를 required 로 지정하면
  # 무관 PR 에서는 체크가 아예 생성되지 않아 영구 대기가 된다.
  #
  # 비용은 들지 않는다: 무거운 `verify` 잡은 `changes` 판정에 따라 skip 되고, 항상 도는
  # 것은 가벼운 `changes` + `gate` 뿐이다(guard-falsifiability.yml 과 동일한 형태).
  pull_request:
  schedule:
    - cron: '0 4 * * 1'  # Monday 04:00 UTC — catch upstream yanks/tampering
  workflow_dispatch:

permissions:
  contents: read
  # `alert-consecutive-failures` 재사용 워크플로우가 요구(상속됨).
  actions: read
  issues: write

# ref/PR 스코프 필수. 전역 상수 그룹 + `cancel-in-progress: true` 는 **서로 무관한
# 런끼리 서로를 취소**한다. 이 워크플로우는 `push` 와 `pull_request` 를 모두 받으므로
# 동시에 여러 ref 가 하나의 슬롯을 다툰다 — 최근 60런 실측(2026-08-24):
#
#   push          : 취소 25 / 성공 9 / 실패 1   → 71% 취소
#   pull_request  : 취소 10 / 성공 10 / 실패 3  → 43% 취소
#   전체          : 35/60 = 58% 취소
#
# 이건 공급망 무결성 게이트다(락 해시 ↔ requirements.txt 검증, 상류 yank/tamper 탐지).
# 절반 이상이 취소되면 게이트가 대부분 **돌지 않는다**. 게다가 PR 브랜치에 푸시하면
# push 런과 pull_request 런이 같은 슬롯을 다퉈 서로를 죽이므로, 어느 쪽도 완주하지
# 못한 채 PR 에는 red X 만 남는다. #1184 가 실제로 그 상태였다 — `sync` 는 통과했는데
# 취소된 `verify` 때문에 막힌 PR 처럼 보였다.
concurrency:
  group: supply-chain-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 변경 판정. `gh api pulls/{n}/files` 를 쓰는 이유는 guard-falsifiability.yml 과 같다 —
  # 추가 액션 의존 없이, fetch-depth 1 로 끝난다.
  #
  # 경로 목록은 아래 `push:` 트리거의 paths 와 **같아야 한다**.
  # `tests/test_supply_chain_lock_gate_guard.py` 가 두 목록의 일치를 강제한다.
  changes:
    name: Detect lock-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - name: Detect
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # schedule / push / workflow_dispatch: 판정 대상이 없으므로 전수 실행.
          if [ -z "${PR_NUMBER}" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "PR 컨텍스트 아님 → 전수 실행"
            exit 0
          fi
          cat > targets.txt <<'TARGETS'
          scripts/requirements.txt
          scripts/requirements.lock
          .github/workflows/supply-chain-lock.yml
          TARGETS
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' > changed.txt
          # -x: 부분일치 금지(경로 전체 일치), -F: 정규식 아님.
          matched=$(grep -Fxf targets.txt changed.txt || true)
          if [ -n "${matched}" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "해당 변경:"; echo "${matched}"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "락 관련 파일 변경 없음 → verify skip"
          fi

  verify:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'  # 락은 3.11 에서 생성됨 — 동일 버전으로 검증

      # 락의 모든 핀 버전+해시가 실제 설치 가능한지 검증(변조/yank 탐지).
      # --dry-run 으로 실제 설치는 생략하되 해시는 전부 다운로드 검증한다.
      # **차단 게이트**(2026-08-26 승격). 비-0 종료 = 잡 실패. `|| echo ...` 같은
      # fallback 을 다시 붙이면 `tests/test_supply_chain_lock_gate_guard.py` 가 막는다.
      # 락 재생성이 필요하면 `bash scripts/refresh_requirements_lock.sh`.
      - name: Verify lock integrity (--require-hashes)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --dry-run -r scripts/requirements.lock

      # 락 staleness 방지: requirements.txt 의 모든 직접 의존성이 락에 핀(==)으로
      # 존재해야 한다. requirements.txt 에 의존성을 추가/제거하고 락을 재생성하지
      # 않으면 여기서 실패한다(결정적 — 버전 churn 노이즈 없음).
      - name: Verify lock covers all direct dependencies
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          req = Path("scripts/requirements.txt")
          lock = Path("scripts/requirements.lock")
          if not req.is_file() or not lock.is_file():
              sys.exit("requirements.txt 또는 requirements.lock 누락")

          def direct_names(text: str) -> set[str]:
              names = set()
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  # PEP 508 이름만 추출 (>=, ==, ~=, <, ; extras 앞부분)
                  m = re.match(r"^([A-Za-z0-9][A-Za-z0-9._-]*)", line)
                  if m:
                      names.add(m.group(1).lower().replace("_", "-"))
              return names

          def locked_names(text: str) -> set[str]:
              names = set()
              for raw in text.splitlines():
                  # 핀 라인은 name==ver 또는 name[extra1,extra2]==ver 형태
                  m = re.match(r"^([A-Za-z0-9][A-Za-z0-9._-]*)(?:\[[^\]]*\])?==", raw)
                  if m:
                      names.add(m.group(1).lower().replace("_", "-"))
              return names

          direct = direct_names(req.read_text(encoding="utf-8"))
          locked = locked_names(lock.read_text(encoding="utf-8"))
          missing = sorted(direct - locked)
          if missing:
              sys.exit(
                  f"requirements.lock 이 다음 직접 의존성을 핀하지 않음: {missing}\n"
                  "requirements.txt 변경 후 락을 재생성하세요 (워크플로우 상단 주석 참고)."
              )
          print(f"OK: 직접 의존성 {len(direct)}개 모두 락에 핀됨 (락 전체 핀 {len(locked)}개).")
          PY

      # 버전-동기: 락의 핀 버전이 requirements.txt 의 PEP 508 명세를 만족해야 한다.
      # 위 커버리지 스텝(이름 기반)이 못 잡는 *버전 bump 후 락 미갱신* stale 을 차단한다.
      # tests/test_requirements_lock_version_sync.py 와 의도적으로 동일 불변식을 동일 방식으로
      # 본다(두 곳이 같은 불변식을 같은 방식으로 본다 — 커버리지 스텝의 정책과 일관).
      # packaging 은 락의 전이 의존성(packaging==26.2)과 동일 버전으로 핀 설치한다.
      - name: Verify lock pins satisfy requirements specifiers
        run: |
          python -m pip install --quiet "packaging==26.2"
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          from packaging.requirements import InvalidRequirement, Requirement
          from packaging.version import InvalidVersion, Version

          req = Path("scripts/requirements.txt")
          lock = Path("scripts/requirements.lock")
          if not req.is_file() or not lock.is_file():
              sys.exit("requirements.txt 또는 requirements.lock 누락")

          inline_comment = re.compile(r"\s+#.*$")
          lock_pin = re.compile(r"^([A-Za-z0-9][A-Za-z0-9._-]*)(?:\[[^\]]*\])?==([^\s\\]+)")

          def norm(name: str) -> str:
              return name.lower().replace("_", "-")

          direct = {}
          for raw in req.read_text(encoding="utf-8").splitlines():
              line = inline_comment.sub("", raw.strip())
              if not line or line.startswith("#"):
                  continue
              try:
                  r = Requirement(line)
              except InvalidRequirement:
                  continue
              direct[norm(r.name)] = r

          locked = {}
          for raw in lock.read_text(encoding="utf-8").splitlines():
              m = lock_pin.match(raw)
              if not m:
                  continue
              try:
                  locked[norm(m.group(1))] = Version(m.group(2))
              except InvalidVersion:
                  continue

          violations = []
          for name, r in direct.items():
              pin = locked.get(name)
              if pin is None:
                  continue  # 이름 부재는 위 커버리지 스텝 책임 (중복 검사 금지)
              # prereleases=True: false-negative 방지
              if not r.specifier.contains(pin, prereleases=True):
                  violations.append(f"{name}: txt '{r.specifier}' -> lock '{pin}'")
          if violations:
              sys.exit(
                  "락 핀이 requirements.txt 명세를 만족하지 않음(버전 bump 후 락 미갱신?):\n"
                  + "\n".join(violations)
                  + "\nbash scripts/refresh_requirements_lock.sh 로 락 재생성."
              )
          print(f"OK: 직접 의존성 {len(direct)}개 핀 모두 txt 명세 만족.")
          PY

  # 주 1회 + push/PR. PR 실패는 작성자가 이미 본다.
  # required status check 대상. 이 잡만 모든 PR 에서 리포트한다.
  #
  # fail-closed: `changes` 가 실패하면 "관련 변경 없음" 을 신뢰할 수 없으므로 통과시키지
  # 않는다. skip 된 `verify` 는 통과로 본다 — 그게 paths 필터의 의미다.
  gate:
    name: Supply-chain lock gate
    if: always()
    needs: [changes, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate upstream results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          echo "changes=${CHANGES_RESULT} verify=${VERIFY_RESULT}"
          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "::error::변경 판정 잡이 ${CHANGES_RESULT} — verify 실행 여부를 판정할 수 없다"
            exit 1
          fi
          case "${VERIFY_RESULT}" in
            failure|cancelled)
              echo "::error::락 무결성 검증이 ${VERIFY_RESULT}"
              exit 1
              ;;
            skipped)
              echo "락 관련 변경 없음 — verify skip (통과)"
              ;;
            success)
              echo "락 무결성 검증 통과"
              ;;
            *)
              echo "::error::예상하지 못한 결과 '${VERIFY_RESULT}'"
              exit 1
              ;;
          esac

  alert-consecutive-failures:
    needs: verify
    if: failure() && github.event_name == 'schedule'
    uses: ./.github/workflows/alert-consecutive-failures.yml
    with:
      workflow-name: 'Supply-chain Lock Verify'
      threshold: 1
    secrets: inherit
