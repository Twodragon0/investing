name: Collect Regulatory News

on:
  schedule:
    - cron: '15 22,6,12 * * *'  # KST 07:15, 15:15, 21:15 (KR open + US pre-market + US market open)
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: collect-regulatory
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Collect regulatory news
        uses: ./.github/actions/python-collect
        with:
          script: scripts/collect_regulatory.py
          commit-message: 'chore: collect regulatory news'
          git-add-paths: '_posts/ _state/ assets/images/'
          # no-op 커밋 생략 파일럿(2026-08-10~). 이 수집기를 고른 이유는 실측
          # 표본 49건 중 27건(55%)이 no-op 이라 코드 경로가 실제로 돌면서도
          # 3회/일이라 폭발 반경이 작기 때문이다. 최소 3일 관측 후 확대 판단:
          # 커밋 수 감소 + 중복 포스트 0건.
          # docs/devsecops/collector-push-batching-design.md
          skip-noop-state-commits: 'true'

  alert-consecutive-failures:
    needs: collect
    if: failure()
    uses: ./.github/workflows/alert-consecutive-failures.yml
    with:
      workflow-name: 'Collect Regulatory News'
    secrets: inherit
