name: Dependency Security Check

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # `alert-consecutive-failures` 재사용 워크플로우가 요구(상속됨).
  actions: read

concurrency:
  group: dependency-check
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt pip-audit

      # 게이트 설계:
      #   - pip-audit 은 발견 시 exit 1. 내부 `|| true` 는 JSON 추출이 끝까지
      #     실행되도록 유지 (그렇지 않으면 set -e 로 VULN_COUNT 계산 전 종료).
      #   - step-level `continue-on-error: true` 는 제거 → JSON 파싱 실패 같은
      #     run-block 오류는 step 실패로 즉시 표면화.
      #   - 취약점 발견 시 잡 실패는 마지막 "Fail on vulnerabilities" step 에서
      #     명시 처리. 이전: continue-on-error + || true 조합으로 step 항상
      #     success → 이슈만 만들고 CI 통과 → silent fail.
      # 영구 수용 리스크: PYSEC-2022-252 는 2022-08 deep-translator PyPI
      # 계정 탈취 공급망 사고(악성 1.8.5 아티팩트, 이미 PyPI 에서 제거됨)다.
      # advisory 에 introduced:1.8.5 만 있고 fixed 이벤트가 없어 OSV/pip-audit 가
      # 1.8.5 이상 모든 버전을 영구 플래그한다 → "수정 버전" 은 구조적으로
      # 존재할 수 없으므로 upstream fix 를 기다리는 것은 무의미.
      # 현재 핀(deep-translator==1.11.4, 2023-06 정상 릴리스)은 clean 이며
      # 사용 표면은 translator.py 의 GoogleTranslator 1개 함수(설치시 훅 없음)뿐.
      # → 코드 교체 대신 ignore 영구 수용이 올바른 결정. 양 워크플로우
      # (code-quality.yml ↔ 여기) ignore 목록은 동기화 유지
      # (tests/test_pip_audit_ignore_sync.py 가드가 강제).
      - name: Run pip-audit
        id: audit
        run: |
          pip-audit -r scripts/requirements.txt --ignore-vuln PYSEC-2022-252 --format=json --output=audit-report.json 2>&1 || true
          pip-audit -r scripts/requirements.txt --ignore-vuln PYSEC-2022-252 2>&1 | tee audit-report.txt || true

          VULN_COUNT=$(python3 -c "
          import json
          try:
              with open('audit-report.json') as f:
                  data = json.load(f)
              vulns = data.get('dependencies', [])
              count = sum(len(d.get('vulns', [])) for d in vulns)
              print(count)
          except:
              print(0)
          ")
          echo "vuln_count=$VULN_COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $VULN_COUNT vulnerabilities"

          # 발견 지문(취약점 ID 집합의 해시). 이슈 중복 판정에 쓴다.
          #
          # 제목이 상수였을 때는 **열려 있는 이슈 하나가 이후 모든 발견의 이슈 생성을
          # 영구히 억제**했다. 실제로 #985(2026-06-01, 지금은 ignore 목록에 든
          # PYSEC-2022-252)가 82일간 그 역할을 했다. 발견이 exit 1 이던 시절에는
          # 잡이 red 라 흔적이 남았지만, exit 0 으로 옮긴 뒤에는 잡도 green 이라
          # 신호가 하나도 남지 않는다.
          #
          # 지문을 제목에 넣으면 발견 내용이 바뀔 때마다 새 이슈가 열리고, 같은
          # 발견의 주간 재실행만 억제된다(원래 의도한 멱등성).
          VULN_FINGERPRINT=$(python3 -c "
          import hashlib, json
          try:
              with open('audit-report.json') as f:
                  data = json.load(f)
              ids = sorted(
                  v.get('id', '')
                  for d in data.get('dependencies', [])
                  for v in d.get('vulns', [])
              )
              print(hashlib.sha256('|'.join(ids).encode()).hexdigest()[:12] if ids else 'none')
          except Exception:
              print('unknown')
          ")
          echo "vuln_fingerprint=$VULN_FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "Finding fingerprint: $VULN_FINGERPRINT"

      - name: Check outdated packages
        run: pip list --outdated --format=columns 2>/dev/null || true

      - name: Create issue on vulnerabilities
        if: steps.audit.outputs.vuln_count != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let report = 'No details available';
            try {
              report = fs.readFileSync('audit-report.txt', 'utf8');
            } catch (e) {}

            const fingerprint = process.env.VULN_FINGERPRINT;
            const title = `🔒 Dependency Security: ${process.env.VULN_COUNT} vulnerabilities found [${fingerprint}]`;
            const body = `## Dependency Security Audit\n\n` +
              `**Vulnerabilities Found**: ${process.env.VULN_COUNT}\n\n` +
              `### Details\n\`\`\`\n${report.substring(0, 3000)}\n\`\`\`\n\n` +
              `*Auto-generated by dependency-check workflow*`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security'
            });

            // **지문이 같은** 열린 이슈만 중복이다. 상수 접두어로 판정하면 이미 열려
            // 있는 이슈 하나가 이후 모든 발견을 침묵시킨다(위 audit step 주석 참조).
            // tests/test_findings_exit_zero_guard.py 가 이 판정식을 지킨다.
            const existing = issues.data.find(i => i.title.includes(`[${fingerprint}]`));
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'dependencies', 'automated']
              });
            }
        env:
          VULN_COUNT: ${{ steps.audit.outputs.vuln_count }}
          VULN_FINGERPRINT: ${{ steps.audit.outputs.vuln_fingerprint }}

      # **발견은 실패가 아니다.** 예전에는 여기서 exit 1 했는데, 그러면 잡 실패가
      # "취약점을 찾았다" 와 "워크플로우가 죽었다" 두 가지를 뜻해 밖에서 구분되지
      # 않는다. 그래서 크래시에 알림을 붙일 수 없었고, 이 워크플로우는 실패 알림
      # 커버리지에서 면제로 남아 있었다.
      #
      # 이제 발견은 exit 0 + 이슈다. 잡 실패는 크래시만 뜻하므로 아래
      # `alert-consecutive-failures` 가 의미를 갖는다.
      #
      # 발견의 유일한 출력 경로가 위 "Create issue on vulnerabilities" 가 되므로
      # 그 step 은 반드시 blocking 이어야 한다(`continue-on-error` 금지).
      # `tests/test_findings_exit_zero_guard.py` 가 강제한다.
      - name: Report vulnerabilities (non-failing)
        if: steps.audit.outputs.vuln_count != '0'
        run: |
          echo "::warning title=pip-audit findings::pip-audit 가 ${{ steps.audit.outputs.vuln_count }} 건의 취약점을 발견했습니다. 자동 생성된 이슈를 확인하세요."

  # 주 1회. 발견을 exit 0 으로 옮겼으므로 잡 실패는 크래시만 뜻한다 — 첫 실패에 알린다.
  alert-consecutive-failures:
    needs: audit
    if: failure()
    uses: ./.github/workflows/alert-consecutive-failures.yml
    with:
      workflow-name: 'Dependency Security Check'
      threshold: 1
    secrets: inherit
