name: Collect Crypto News

on:
  schedule:
    - cron: '0 21,1,5,9,13,17 * * *'  # KST 06:00, 10:00, 14:00, 18:00, 22:00, 02:00 (every 4h, crypto peak hours)
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: collect-crypto-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Collect crypto news
        uses: ./.github/actions/python-collect
        with:
          script: scripts/collect_crypto_news.py
          install-playwright: 'true'
          commit-message: 'chore: collect crypto news'
          git-add-paths: '_posts/ _state/ assets/images/'
          # no-op 커밋 생략 — regulatory 파일럿(2026-08-10~) 1차 확대.
          # 07-20 이후 실측 136커밋 중 96건(70.6%)이 no-op 으로 6개 수집기 중 최다다.
          # docs/devsecops/collector-push-batching-design.md
          skip-noop-state-commits: 'true'

  alert-consecutive-failures:
    needs: collect
    if: failure()
    uses: ./.github/workflows/alert-consecutive-failures.yml
    with:
      workflow-name: 'Collect Crypto News'
      # 6회/일(4시간 주기)로 단발 실패가 잦아 threshold 완화
      threshold: 5
    secrets: inherit
