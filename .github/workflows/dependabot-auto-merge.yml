name: Dependabot Auto-Merge

# 이 워크플로우는 2026-09-14 까지 **모든 patch PR 에서 red 였다**. 원인이 두 개 겹쳐
# 있었고, 하나만 고쳐도 여전히 red 다 (2026-09-15 실측):
#
#   1. `gh pr review --approve` →
#      "GitHub Actions is not permitted to approve pull requests. (addPullRequestReview)"
#      저장소 설정 `can_approve_pull_request_reviews: false`. 그런데 main 룰셋
#      (20539046)에는 required review 가 **없다** — 승인은 애초에 머지 조건이
#      아니었다. 없어도 되는 스텝이 워크플로우 전체를 죽이고 있었다.
#      (`shell: bash -e` 라서 이 스텝이 죽으면 머지 스텝은 실행조차 안 된다.)
#   2. `gh pr merge --auto` → 저장소 설정 `allow_auto_merge: false`.
#
# 2 를 켜는 것(저장소 설정 변경)은 택하지 않았다. required status check 가 하나도
# 없는 상태에서 GitHub auto-merge 를 켜면 **체크 결과와 무관하게** 머지된다 —
# docs/devsecops/branch-protection.md §5.3 이 경고하는 바로 그 구멍이고, stale 락이
# 사람 리뷰 없이 들어간 #1321 같은 상황을 자동화하는 꼴이 된다.
#
# 그래서 대기를 이 워크플로우가 직접 한다: 자기 자신을 제외한 모든 체크가 끝날 때까지
# 폴링하고, 하나라도 실패하면 머지하지 않고 red 를 낸다. required check 가 도입되면
# (Phase 2) 이 루프를 지우고 `--auto` 로 되돌릴 수 있다.
#
# 가드: tests/test_dependabot_auto_merge_guard.py

on:
  pull_request:
  # 수동 경로. **자동 경로의 게이트를 완화하는 대신 더한 것**이다.
  #
  # 왜 필요한가: `github.actor` 는 그 런을 **누가 밀었는지**다. 사람이 dependabot
  # 브랜치에 커밋하면(락 재생성 등) actor 가 사람이 되어 아래 게이트에서 잡이 skip
  # 된다 — 실측 런 34938642606 · 34465007806 · 34442783407 전부 `skipped`,
  # `actor=Twodragon0`. 즉 락을 고치는 순간 그 PR 의 자동 머지는 영영 돌지 않는다.
  #
  # 게이트를 PR 작성자 기준으로 **완화**하는 안도 검토했으나 철회했다. 현행 actor
  # 게이트는 잡 자체가 뜨지 않으므로 **워크플로우 수정으로 우회할 수 없는** 유일한
  # 통제인데(`on: pull_request` 런은 PR 의 merge-ref 파일을 실행한다 —
  # docs/devsecops/requirements-lock-autosync-design.md §9.4 와 같은 전제), 완화 뒤
  # 커밋 작성자 검사로 되막으려던 안은 그 검사 자체가 같은 푸시로 지워질 수 있어
  # 통제가 되지 못했다. 게다가 그 검사가 사람 커밋을 막으므로 순효과가 0 이었다.
  workflow_dispatch:
    inputs:
      pr:
        description: "머지할 dependabot PR 번호 (사람이 락을 고친 뒤 쓰는 경로)"
        required: true
        type: string

# 이 잡은 최대 25분을 폴링으로 보낸다. `synchronize`(dependabot rebase, 락 커밋백)
# 마다 새 런이 뜨는데 이전 런을 두면 둘이 동시에 `gh pr merge` 를 호출해 한쪽이
# "이미 머지됨" 으로 red 가 된다. 옛 런은 어차피 낡은 head 를 보고 있어
# `--match-head-commit` 에 걸리므로 취소가 맞다.
#
# 그룹에 PR 번호를 넣는 이유: 전역 상수 그룹 + `cancel-in-progress` 는 서로 다른
# PR 의 런을 교차 취소한다. `supply-chain-lock.yml` 에서 런 58%가 그렇게 취소된
# 실측이 있다(#1199). `tests/test_workflow_concurrency_scope_guard.py` 가 강제한다.
#
# `inputs.pr` 이 체인에 있어야 하는 이유: `workflow_dispatch` 런에는
# `github.event.pull_request` 가 없어 `github.ref` 로 폴백하는데, dispatch 의 ref 는
# 보통 기본 브랜치라 **서로 다른 PR 의 수동 런이 같은 그룹에 묶인다**.
# `cancel-in-progress: true` 와 합쳐지면 한쪽이 다른 쪽을 죽인다.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

# `contents: write` 는 머지 API 호출에, `pull-requests: write` 는 PR 조회·머지에
# 필요하다. 저장소 기본값은 read 라 여기서 명시적으로 올린다. 가드가 이 값을
# 지킨다 — 다운그레이드하면 머지가 403 으로 죽는데, 그건 red 라 알아채기까지
# 다음 Dependabot PR 을 기다려야 한다.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge
    # 자동 경로는 **dependabot 이 민 것**만. 이 조건을 PR 작성자 기준으로 바꾸지 말 것
    # (위 `workflow_dispatch` 주석 참조). 수동 경로는 별도 조건으로 더한다.
    if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 폴링 상한(DEADLINE_SECONDS)보다 커야 한다. 가드가 그 관계를 강제한다.
    # 현재 PR 전체 체크는 ~13분 (2026-09-15 #1324 실측, quality 가 최장).
    timeout-minutes: 30
    steps:
      # 이 액션은 dependabot 이 트리거한 PR 컨텍스트를 전제한다. `workflow_dispatch`
      # 에서 동작하는지 확인된 바 없으므로 자동 경로에서만 돌린다.
      - name: Fetch Dependabot metadata
        id: metadata
        if: github.event_name == 'pull_request'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ github.token }}

      # 수동 경로에는 metadata 가 없으므로 대상이 정말 dependabot PR 인지 여기서 본다.
      # 이 검사가 없으면 아무 PR 이나 번호만 넣어 이 경로로 머지할 수 있다.
      - name: Verify dispatch target is a Dependabot PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ inputs.pr }}
        run: |
          set -euo pipefail
          author="$(gh pr view "$PR_URL" --json author --jq '.author.login')"
          # 표기가 두 가지다. `gh` 는 봇을 `app/dependabot` 으로 주고, 이벤트
          # 페이로드는 `dependabot[bot]` 이다(2026-09-16 실측). 한쪽만 받으면 게이트가
          # 조용히 항상-false 가 되는데, 그 방향은 red 를 내지 않아 드러나지 않는다.
          case "$author" in
            'app/dependabot' | 'dependabot[bot]') ;;
            *)
              echo "::error::dependabot PR 이 아니다 (author=${author}). 이 경로는 dependabot PR 전용이다."
              exit 1
              ;;
          esac
          echo "대상 확인: ${PR_URL} (author=${author})"

      # 자동 경로는 patch 로 한정한다 — 사람 검토 없이 동작 변경이 들어오면 안 된다.
      # 수동 경로에는 그 제한을 두지 않는다. 실행한 사람이 대상을 직접 골랐고, 그는
      # 어차피 `gh pr merge` 를 직접 칠 수 있으므로 새로 얻는 권한이 없다. 이 경로가
      # 대신 해 주는 일은 "모든 체크가 끝날 때까지 기다렸다가 머지" 뿐이다.
      # (범위 제약 bump 는 semver-major 로 분류돼 자동 경로를 아예 타지 못한다 —
      #  실측 #1321 · #1329. 수동 경로까지 patch 로 묶으면 정작 막히는 PR 을 못 푼다.)
      - name: Wait for checks, then merge (patch only)
        if: >-
          (github.event_name == 'pull_request'
            && steps.metadata.outputs.update-type == 'version-update:semver-patch')
          || github.event_name == 'workflow_dispatch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url || format('https://github.com/{0}/pull/{1}', github.repository, inputs.pr) }}
          GH_TOKEN: ${{ github.token }}
          # 이 잡 자신의 체크. 제외하지 않으면 자기가 끝나기를 기다리며 교착한다.
          # 이름만으로 제외하면 다른 워크플로우에 같은 이름의 잡이 생겼을 때 진짜
          # 체크가 조용히 빠지므로 워크플로우 이름까지 함께 맞춘다. 두 값은 이 파일의
          # `name:` 들과 일치해야 하고, 가드가 그 일치를 강제한다.
          SELF_CHECK: auto-merge
          SELF_WORKFLOW: Dependabot Auto-Merge
          DEADLINE_SECONDS: "1500"
          POLL_SECONDS: "30"
        run: |
          set -euo pipefail

          deadline=$((SECONDS + DEADLINE_SECONDS))
          err_file="$(mktemp)"
          previous=""
          head=""

          while true; do
            # 상한 검사는 **루프 맨 앞**에 둔다. 아래 재시도 경로에 두지 않으면
            # 조회가 계속 실패할 때 deadline 을 영영 통과하지 못한다(잡 타임아웃까지
            # 30분 공회전). 스텁 하네스로 실측한 실제 결함이다.
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::${DEADLINE_SECONDS}s 안에 체크가 끝나지 않았다"
              exit 1
            fi

            # 머지 대상 SHA 를 체크 조회와 같은 시점에 고정한다. 마지막 폴링 이후
            # dependabot rebase 로 head 가 바뀌면 `--match-head-commit` 이 머지를
            # 거부한다 — 검증하지 않은 커밋이 들어가는 TOCTOU 를 닫는다.
            head="$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid 2>/dev/null || true)"

            # `gh pr checks` 는 **대기 중이면 exit 8, 실패가 있으면 exit 1** 로 끝난다.
            # 즉 정상 경로에서도 non-zero 다. 종료코드로 판정하면 출력을 통째로 버려
            # 루프가 영원히 재시도만 한다 — 실측된 결함이므로 종료코드만 삼키고
            # 판정은 내용으로 한다.
            raw="$(gh pr checks "$PR_URL" --json name,state,workflow 2>"$err_file" || true)"

            if [ -z "$raw" ] || [ -z "$head" ]; then
              # stderr 를 통째로 버리면 인증 만료·레이트리밋·URL 오류가 전부 같은
              # 한 줄로 보인다. 마지막 줄만 실어 진단을 남긴다.
              echo "체크 목록을 읽지 못했다 — 재시도 ($(tail -n 1 "$err_file" 2>/dev/null || true))"
              sleep "$POLL_SECONDS"
              continue
            fi

            others="$(echo "$raw" | jq -c --arg self "$SELF_CHECK" --arg wf "$SELF_WORKFLOW" '
              [ .[] | select((.name == $self and .workflow == $wf) | not) ]')"

            # 모르는 state 는 대기도 성공도 아닌 **실패**로 분류한다. 안전한 쪽으로
            # 틀리게 하려는 것이다 — 새 state 가 생겨도 조용히 머지되지 않는다.
            failed="$(echo "$others" | jq -r '
              [ .[]
                | select(.state | IN("SUCCESS","SKIPPED","NEUTRAL","PENDING","QUEUED","IN_PROGRESS","EXPECTED","REQUESTED","WAITING") | not)
                | .name
              ] | join(", ")')"
            if [ -n "$failed" ]; then
              echo "::error::통과하지 못한 체크가 있어 머지하지 않는다: ${failed}"
              exit 1
            fi

            waiting="$(echo "$others" | jq -r '
              [ .[] | select(.state | IN("PENDING","QUEUED","IN_PROGRESS","EXPECTED","REQUESTED","WAITING")) ] | length')"
            total="$(echo "$others" | jq -r 'length')"

            # `waiting == 0` 만 보면 "전부 통과" 와 "볼 체크가 아직 하나도 없다" 가
            # 구별되지 않는다. 또 Vercel·GitGuardian 등 GitHub App 이 올리는 commit
            # status 는 잡 시작 뒤 최대 ~96초 지나 **처음 목록에 나타난다**(2026-09-14
            # #1320 실측) — 없는 체크는 대기 대상이 아니므로 그 사이에 break 하면
            # 건너뛴다. 그래서 (a) 체크가 1건 이상이고 (b) 직전 폴링과 목록이 동일할
            # 때만 빠져나간다.
            if [ "$total" -gt 0 ] && [ "$waiting" -eq 0 ]; then
              current="$(echo "$others" | jq -r '[ .[].name ] | sort | join(",")')"
              if [ "$current" = "$previous" ]; then
                break
              fi
              previous="$current"
              echo "체크 ${total}건 전부 통과 — 늦게 생성되는 체크 확인을 위해 ${POLL_SECONDS}s 뒤 재확인"
              sleep "$POLL_SECONDS"
              continue
            fi

            echo "대기 중인 체크 ${waiting}건 / 전체 ${total}건 — ${POLL_SECONDS}s 후 재확인"
            sleep "$POLL_SECONDS"
          done

          echo "모든 체크 통과 — squash 머지 (head=${head})"
          gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$head"
