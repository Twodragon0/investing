name: Lighthouse CI

on:
  push:
    branches: [main]
    paths:
      - '_layouts/**'
      - '_sass/**'
      - 'assets/**'
      - 'pages/**'
      - 'sw.js'
      - 'manifest.json'
  schedule:
    - cron: '0 15 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83  # v1.328.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Serve site
        run: |
          npx serve _site -l 8080 &
          sleep 3

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18  # v12
        with:
          urls: |
            http://localhost:8080/
            http://localhost:8080/reports/
            http://localhost:8080/crypto/
            http://localhost:8080/market-analysis/
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Check scores
        run: |
          echo "Lighthouse audit complete. Check artifacts for detailed scores."
          echo "Target: Performance 80+, Accessibility 90+, SEO 90+, PWA partial"
