name: Post Quality Check

on:
  push:
    branches: [main]
    paths:
      - '_posts/**'
      - 'scripts/improve_existing_posts.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run quality audit (dry-run)
        run: |
          cd scripts
          python improve_existing_posts.py --dry-run 2>&1 | tee /tmp/quality-report.txt
          echo "---"
          echo "Quality audit complete."

      # 예전 grep 패턴은 dry-run 출력에 존재하지 않는 문구를 찾았다 — 각 포스트는
      # `[DRY] <file>: …` 로, 총계는 `Posts modified: N` 으로 보고된다. 실측:
      # 출력 36줄 중 패턴 매칭 0건, `[DRY]` 26건. 즉 이 스텝은 언제나
      # "Issues found: 0" 이었다. 이제 스크립트가 스스로 내는 요약 줄을 읽는다.
      #
      # 설명은 `run:` 밖에 둔다 — 안에 두면 이 배선을 지키는 가드 테스트가
      # 주석 문구에 매칭돼 항상 실패하고, 명백한 "수정"이 동작이 아니라 주석을
      # 지우는 쪽이 된다.
      - name: Check for issues
        run: |
          set -euo pipefail
          ISSUES=$(sed -n 's/^Posts modified:[[:space:]]*\([0-9]\+\).*/\1/p' /tmp/quality-report.txt | tail -1)
          if [ -z "$ISSUES" ]; then
            echo "::error::dry-run 리포트에 'Posts modified:' 요약이 없다 — 출력 형식이 바뀌었는지 확인하라"
            exit 1
          fi
          echo "Issues found: $ISSUES"
          if [ "$ISSUES" -gt 50 ]; then
            echo "::warning::High number of quality issues detected: $ISSUES"
          fi

      # 예전 구현은 대상을 `find _posts -newer /tmp/quality-report.txt` 로 골랐다.
      # 그 리포트는 **같은 잡의 앞선 스텝**이 만들고, 그 시점엔 체크아웃이 이미
      # 모든 포스트를 써놓았다 — 리포트가 항상 더 새로워 find 는 0건을 낸다.
      # find 는 매칭이 없어도 exit 0 이라 `|| … tail -20` 폴백도 안 돈다.
      # 결과: 루프 본문이 한 번도 실행되지 않았다(run 33591232799 실측 — 스텝
      # 시작 9.8ms 뒤에 "Untranslated lines found: 0" 출력).
      #
      # 이제 파일명 날짜로 대상을 고르고(mtime 무관, 결정적), 스캔 건수가 0이면
      # 스크립트가 실패한다 — 아무것도 보지 않은 검사가 green 을 보고하는 것이
      # 검사가 없는 것보다 나쁘다.
      # 상한 유도 근거. 이 검사는 advisory 로 시작해 7일 창에서 106건을 보고했고,
      # advisory 는 아무것도 막지 않았다. 원인은 translate_to_korean 의 fail-open
      # (실패 시 원문 반환 + DEBUG 로그, 재시도 없음)이고, 재시도만으로 106 → 0 이
      # 됐다(2026-09-02, scripts/tools/fix_untranslated_body.py).
      #
      # 상한 10 은 현재 상태 0 위의 순수 헤드룸이다: 113개 포스트가 도는 7일 창에서
      # 일시적 누락 몇 건은 통과시키되, 막으려는 회귀(106건)는 확실히 잡는다.
      # 0 으로 조이지 않는 이유는 자동 커밋 저장소에서 일시적 실패 한 건이 main 을
      # red 로 만들기 때문이다. 상한이 성립하는 전제는 python-collect 액션의
      # "Retry translation for untranslated body lines" 스텝이다 — 그 스텝을 빼면
      # 미번역이 하루 ~15건씩 재축적되어 이 상한은 며칠 안에 터진다.
      - name: Detect untranslated English in post bodies
        run: python3 scripts/tools/check_untranslated_body.py --days 7 --max-findings 10
