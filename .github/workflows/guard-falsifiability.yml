name: Guard Falsifiability

# 격리 가드가 vacuous(무엇을 꺼도 green) 해지지 않았는지 주기 감시.
# 가드 자체는 code-quality 스위트에서 매 PR 돌지만, "통과한다"만으로는 가드가
# 실제로 fixture 부재를 잡아내는지 알 수 없다. 이 잡은 fixture 를 하나씩 실제로
# 비활성화해 대응 가드가 red 가 되는지 확인한다. 규약: docs/test-isolation.md
on:
  pull_request:
    branches: [main]
    paths:
      # 격리 fixture 가드
      - 'tests/conftest.py'
      - 'tests/test_suite_isolation_guard.py'
      # 정적/설정 가드 — 가드 본체와 그 가드가 감시하는 설정 양쪽
      - 'tests/test_state_path_anchoring.py'
      - 'tests/test_hermetic_test_writes_guard.py'
      - 'tests/test_coverage_floor_guard.py'
      - 'pyproject.toml'
      - '.github/workflows/code-quality.yml'
      # 공급망/시크릿 가드 — 가드 본체와 감시 대상 설정 양쪽
      - 'tests/test_workflow_action_pinning_guard.py'
      - 'tests/test_secret_scan_gate_guard.py'
      - 'tests/test_workflow_permission_gate_guard.py'
      # 구분자 정규식 가드 — 가드 본체와 감시 대상 소스
      - 'tests/test_delimiter_regex_guard.py'
      - 'scripts/common/summarizer.py'
      - '.gitleaks.toml'
      - '.github/workflows/security-scan.yml'
      - '.github/workflows/lighthouse-ci.yml'
      # 하네스 자신
      - 'scripts/tools/guard_falsifiability.py'
      - '.github/workflows/guard-falsifiability.yml'
  schedule:
    # 매주 월요일 05:00 UTC (KST 14:00). code-quality 주간 잡(일요일 04:00 UTC)과
    # 겹치지 않게 배치.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-falsifiability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  falsifiability:
    runs-on: ubuntu-latest
    # 케이스당 pytest 를 2회(patched/control) 띄우므로 47종 = 94회 프로세스 기동.
    # 가드 테스트 자체는 각 1초 미만이고 대부분이 인터프리터 시작 비용이다.
    #
    # 샤딩: 케이스가 **실제 레포 파일**을 변형했다 복원하므로 한 체크아웃 안에서
    # 병렬로 돌릴 수 없다(두 케이스가 같은 파일을 노리면 서로의 복원을 덮어쓴다).
    # 대신 매트릭스로 나눠 샤드마다 독립 체크아웃을 쓴다. 분할이 정확한지는
    # tests/test_guard_falsifiability_shard.py 가 강제한다 — 조용히 빠진 케이스는
    # 가드 하나가 검증되지 않은 채 CI 가 그린인 상태를 만든다.
    #
    # 실측 추이: 11케이스 1m44s -> 37케이스 3m49s -> 47케이스 4m09s (약 5s/케이스).
    # 8샤드면 샤드당 6케이스 안팎으로 ~1분.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # 샤드 수는 매트릭스 길이에서 파생한다. `/8` 을 하드코딩하면 매트릭스를
    # 줄였을 때 남는 샤드의 케이스가 조용히 미실행된다 — 정확히 이 하네스가
    # 막으려는 종류의 침묵이다.
    name: falsifiability (${{ matrix.shard }}/${{ strategy.job-total }})
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt pytest pytest-cov

      - name: Run falsifiability harness
        # 하네스는 tests/conftest.py 를 덮어썼다 복원한다. 러너 체크아웃은
        # 일회성이고 permissions 도 read 이므로 유출 경로가 없다.
        run: python scripts/tools/guard_falsifiability.py --check --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Verify working tree restored
        # 하네스가 finally 에서 복원하지 못하고 죽는 회귀를 잡는다. 대상은 두 가지:
        # conftest.py 원본, 그리고 module-level 케이스가 리다이렉트를 깨뜨린
        # 동안 atexit flush 가 기록해버린 _state/image_rejection_metrics.json.
        # 로컬은 skip-worktree(dev_ignore_state.sh)가 후자를 가려서 CI 에서만
        # 드러났다 — 이 단계가 실제로 그 회귀를 잡아낸 이력이 있다.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::하네스 실행 후 워킹 트리가 더럽다 — 복원 실패"
            git status --porcelain
            exit 1
          fi
