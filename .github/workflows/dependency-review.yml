---
name: Dependency Review

# PR 이 **새로** 들여오는 의존성만 본다. `dependency-check.yml` 의 pip-audit 은
# 이미 설치된 전체 트리를 주기적으로 훑는 반면, 이쪽은 diff 에서 추가된 것만
# 보고 머지 전에 막는다 — 취약 의존성이 들어온 뒤 다음 주 스캔에서 발견되는
# 대신, 들어오는 순간 차단된다.
#
# 경로 필터를 두지 않는다. `dependency-review-action` 은 PR 의 의존성 diff 를
# 보므로 매니페스트가 바뀌지 않은 PR 에서는 검사할 것이 없어 즉시 통과한다 —
# 필터로 아끼는 시간(~30s)보다, required status check 로 지정할 수 있게 되는
# 값이 크다. 워크플로우 수준 `paths:` 가 걸리면 그 경로를 건드리지 않은 PR 에서
# 체크가 생성되지 않아 required 지정 시 영구 대기한다.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # moderate 이상에서 실패. 이 저장소의 pip-audit 게이트와 같은 기준선.
          fail-on-severity: moderate
          # 라이선스는 차단하지 않고 요약에만 남긴다 — 데이터 소스 SDK 들이
          # 제각각이라 허용 목록을 유지하는 비용이 이득보다 크다.
          comment-summary-in-pr: on-failure
