name: Classify Workflow Failures

on:
  workflow_run:
    workflows:
      - Collect Crypto News
      - Collect DeFi Llama Data
      - Collect Stock News
      - Collect Social Media
      - Collect Regulatory News
      - Collect Political Trades
      - Collect CoinMarketCap Data
      - Collect WorldMonitor News
      - Collect FMP Calendar
      - Collect Market Indicators
      - Collect Geopolitical Risk Data
      - Generate Daily Summary
      - Weekly Digest
      - Ops 10AM Digest
      - Backfill Post Summaries
      - Deploy Jekyll to GitHub Pages
      - Site Health Check
      - Security Scan
      - Code Quality
      - Guard Falsifiability
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: classify-failures-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  classify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # 분류와 근거 추출은 `scripts/tools/classify_failure_log.py` 가 한다.
      #
      # 인라인 grep 이었을 때의 결함: pytest 로그는 대부분 *테스트 이름*이고, 이
      # 저장소의 테스트 이름에 `timeout`/`exception` 이 들어 있다
      # (`test_wait_for_with_timeout`, `test_fetch_exception_propagates`).
      # 실측(run 32456925989 → issue #1181): failed.log 의 `timeout` 매치 20건 중
      # 16건이 `PASSED` 라인, 나머지는 PytestConfigWarning. 진짜 네트워크 신호는 0건.
      # 그런데도 raw=network 로 분류돼 ~13분 quality 잡을 무의미하게 rerun 하고,
      # attempt 2 에서 code 로 escalate 해 신호가 늦게, 잘못된 라벨로 도착했다.
      #
      # 이 파일에 로직을 다시 인라인하지 말 것 —
      # `tests/test_classify_failure_log.py` 가 배선까지 검증한다.
      - name: Classify failure type
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --log-failed > failed.log 2>&1 || gh run view "$RUN_ID" > failed.log 2>&1 || true
          python3 scripts/tools/classify_failure_log.py \
            --log failed.log \
            --github-output "$GITHUB_OUTPUT"

      - name: Finalize classification with escalation
        id: classify_final
        shell: bash
        env:
          RAW_CLASSIFICATION: ${{ steps.classify.outputs.classification }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          final_classification="$RAW_CLASSIFICATION"
          escalated="false"

          if [ "$RAW_CLASSIFICATION" = "network" ] && [ "$RUN_ATTEMPT" -ge 2 ]; then
            final_classification="code"
            escalated="true"
          fi

          echo "final_classification=$final_classification" >> "$GITHUB_OUTPUT"
          echo "escalated=$escalated" >> "$GITHUB_OUTPUT"

      - name: Retry transient failure once
        id: rerun
        if: steps.classify.outputs.classification == 'network' && github.event.workflow_run.run_attempt < 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run rerun "$RUN_ID"
          echo "rerun=true" >> "$GITHUB_OUTPUT"

      - name: Mark no rerun
        if: steps.rerun.outputs.rerun != 'true'
        shell: bash
        run: echo "rerun=false" >> "$GITHUB_OUTPUT"

      - name: Create issue for code failures
        if: steps.classify_final.outputs.final_classification == 'code' && steps.rerun.outputs.rerun != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          EVIDENCE_SNIPPET: ${{ steps.classify.outputs.evidence_snippet }}
          RAW_CLASSIFICATION: ${{ steps.classify.outputs.classification }}
          FINAL_CLASSIFICATION: ${{ steps.classify_final.outputs.final_classification }}
          ESCALATED: ${{ steps.classify_final.outputs.escalated }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const headSha = (run.head_sha || '').slice(0, 12);
            const dedupeKey = `workflow=${run.name}|run=${run.run_number}|sha=${headSha}`;
            const title = `CI code failure: ${run.name}  #${run.run_number} (${headSha || 'no-sha'})`;
            const evidence = process.env.EVIDENCE_SNIPPET || 'no evidence captured';
            const body = [
              '## Automated failure classification',
              '',
              `- Workflow: ${run.name}`,
              `- Run: ${run.html_url}`,
              `- Attempt: ${run.run_attempt}`,
              `- Head SHA: ${run.head_sha || 'N/A'}`,
              `- Dedupe Key: ${dedupeKey}`,
              `- Conclusion: ${run.conclusion}`,
              `- Classification (raw): ${process.env.RAW_CLASSIFICATION}`,
              `- Classification (final): ${process.env.FINAL_CLASSIFICATION}`,
              `- Escalated from network: ${process.env.ESCALATED}`,
              '',
              '### Classifier evidence',
              '```text',
              evidence,
              '```',
              '',
              'Action: investigate code or configuration changes in this run.'
            ].join('\n');

            // `github.paginate` 필수 — `listForRepo` 는 기본 30건만 준다.
            // 2026-08-24 실측으로 open `ci-failure` 이슈가 363건이었고, 그 상태에서
            // dedupe 창은 최신 30건으로 잘려 있었다. 즉 31번째 이후로 밀려난
            // 이슈와 같은 실패가 재발하면 중복 이슈가 새로 생긴다.
            // `per_page: 100` 이므로 363건은 4요청. 실패 경로에서만 도는 호출이다.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 100
            });

            const exists = issues.some(
              issue => issue.title === title || (issue.body || '').includes(`Dedupe Key: ${dedupeKey}`)
            );
            if (!exists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure', 'automated', 'code-failure']
              });
            }

      - name: Resolve Slack config
        id: slack
        uses: ./.github/actions/resolve-slack-config
        with:
          target_channel_alias: investing
          bot: default
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_CHANNEL_ID_INVESTING: ${{ secrets.SLACK_CHANNEL_ID_INVESTING }}

      - name: Post classified failure to Slack
        if: steps.slack.outputs.can_post == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          errors: true
          method: chat.postMessage
          token: ${{ steps.slack.outputs.token }}
          payload: |
            channel: "${{ steps.slack.outputs.channel }}"
            text: |
              :rotating_light: *CI Failure: ${{ github.event.workflow_run.name }}*  #${{ github.event.workflow_run.run_number }}
              • Classification: `${{ steps.classify_final.outputs.final_classification }}` (raw: `${{ steps.classify.outputs.classification }}`)
              • Escalated: ${{ steps.classify_final.outputs.escalated }}  |  Retried: ${{ steps.rerun.outputs.rerun || 'false' }}
              • Run: ${{ github.event.workflow_run.html_url }}
