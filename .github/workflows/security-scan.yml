---
name: Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - '.gitleaks.toml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      # 권한 감사가 의미를 가지려면 워크플로우 변경에서 돌아야 한다. 이전 필터는
      # `scripts/**` 와 `.gitleaks.toml` 뿐이어서, 새 워크플로우를 permissions
      # 블록 없이 추가해도 이 잡이 실행조차 되지 않았다.
      - '.github/workflows/**'
      - '.gitleaks.toml'
  schedule:
    - cron: '0 3 * * 1'  # Every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit[sarif]

      # 게이트 설계:
      #   - bandit 은 medium+ severity/confidence 에서 발견 시 exit 1.
      #   - SARIF 업로드는 항상 수행 (GitHub Security 탭에 트렌드 보존) → upload
      #     step 에 `if: always()`.
      #   - 잡 실패는 마지막 "Fail on bandit findings" step 에서 명시적으로 처리.
      #     이전: `|| true` 로 즉시 swallow → 발견되어도 잡 success → silent fail.
      - name: Run bandit security scan
        id: bandit-sarif
        continue-on-error: true
        run: |
          bandit -r scripts/ \
            -f sarif \
            -o bandit-results.sarif \
            --severity-level medium \
            --confidence-level medium \
            -x scripts/verify_rendered_fixtures.py,scripts/validate_collector_summary_contract.py

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@256d634097be96e792d6764f9edaefc4320557b1  # v4
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Run bandit (human-readable)
        id: bandit-summary
        continue-on-error: true
        run: |
          echo "## Bandit Security Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          bandit -r scripts/ \
            --severity-level medium \
            --confidence-level medium \
            -x scripts/verify_rendered_fixtures.py,scripts/validate_collector_summary_contract.py \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          PIPE_STATUS=("${PIPESTATUS[@]}")
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # bandit exit (PIPESTATUS[0]) 가 0 이 아니면 step outcome = failure.
          exit "${PIPE_STATUS[0]}"

      - name: Fail on bandit findings
        if: steps.bandit-sarif.outcome == 'failure' || steps.bandit-summary.outcome == 'failure'
        run: |
          echo "::error title=Bandit findings::Bandit SAST 가 medium+ 심각도 이슈를 발견했습니다. SARIF 업로드 결과를 GitHub Security 탭에서 확인하세요."
          echo "  - bandit-sarif outcome: ${{ steps.bandit-sarif.outcome }}"
          echo "  - bandit-summary outcome: ${{ steps.bandit-summary.outcome }}"
          exit 1

  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        # --config 명시: gitleaks v8.24.2 는 .gitleaks.toml 을 자동 로드하지
        # 않아 명시적 경로 지정 필요. --config 없이는 _state/translation_cache.json
        # 의 linkedin-client-secret 오탐 244건이 다시 발생.
        run: |
          set -euo pipefail
          gitleaks version
          gitleaks detect --source . --config .gitleaks.toml --no-banner --verbose --redact

  actions-permissions:
    name: Workflow Permissions Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # 이 잡은 2026-08-06 감사 전까지 **build 를 실패시킬 수 없었다**:
      #   - 모든 발견이 `::warning::` 이고 어떤 경로로도 exit 하지 않았다.
      #   - 액션 핀닝 체크의 `has_issues=true` 는 `grep ... | while` 파이프라인
      #     서브셸에 갇혀 전파조차 되지 않았다.
      #   - `grep -v '@v'` 가 문제의 대상인 가변 태그를 "핀됨"으로 분류했다.
      # 즉 "감사"라는 이름으로 잘못된 안심을 주고 있었다. 이제 차단한다.
      #
      # 액션 핀닝은 여기서 빠졌다 — `tests/test_workflow_action_pinning_guard.py`
      # 가 40-hex SHA 핀을 blocking pytest 로 강제하고, falsifiability 하네스가
      # 그 가드가 vacuous 하지 않음을 매 PR 검증한다. 여기 grep 을 남겨두면
      # 같은 불변식을 두 곳에서, 그것도 한쪽은 틀리게 검사하는 셈이다.
      - name: Audit workflow permissions
        shell: bash
        run: |
          set -euo pipefail

          echo "## Workflow Permissions Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          has_issues=false

          for wf in .github/workflows/*.yml; do
            name=$(basename "$wf")

            # 과대 권한: 최소권한 원칙 위반. GITHUB_TOKEN 노출면이 전 스코프로 열린다.
            if grep -qP '^permissions:\s+write-all' "$wf" 2>/dev/null; then
              echo "::error file=$wf::Uses write-all permissions"
              echo "- :x: \`$name\`: Uses \`write-all\` permissions" >> "$GITHUB_STEP_SUMMARY"
              has_issues=true
            fi

            # 최상위 permissions 누락: 레포 기본값(대개 write)이 그대로 적용된다.
            if ! grep -qP '^permissions:' "$wf" 2>/dev/null; then
              echo "::error file=$wf::Missing explicit permissions block"
              echo "- :x: \`$name\`: Missing explicit \`permissions:\` block" >> "$GITHUB_STEP_SUMMARY"
              has_issues=true
            fi
          done

          if [ "$has_issues" = true ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "권한 감사 실패 — 위 워크플로우에 최소권한 \`permissions:\` 블록을 명시하세요." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "All workflows passed permissions audit." >> "$GITHUB_STEP_SUMMARY"
